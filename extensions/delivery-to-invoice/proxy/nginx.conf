# Same-origin reverse proxy in front of the SAP B1 Web Client.
# nginx owns :443; the Web Client (gate.jar) is moved to :8443 on localhost.
#   https://<host>/d2i/*  -> Delivery-to-Invoice backend (strips /d2i)
#   https://<host>/*      -> SAP B1 Web Client (incl. WebSockets)
# Same origin => satisfies the Web Client CSP (default-src 'self'); set the extension
# "Backend URL" to https://<host>/d2i.
events {}
http {
  map $http_upgrade $connection_upgrade { default upgrade; '' close; }

  server {
    listen 443 ssl;
    ssl_certificate     /certs/fullchain.pem;
    ssl_certificate_key /certs/privkey.pem;
    client_max_body_size 50m;

    location /d2i/ {
      proxy_pass http://192.168.1.30:2020/;
      proxy_set_header Host $host;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto https;
      proxy_read_timeout 300s;
    }

    location / {
      proxy_pass https://127.0.0.1:8443;
      proxy_ssl_verify off;
      proxy_http_version 1.1;
      proxy_set_header Host $http_host;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto https;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection $connection_upgrade;
      proxy_read_timeout 3600s;
      proxy_buffer_size 32k;
      proxy_buffers 8 32k;
    }
  }
}
