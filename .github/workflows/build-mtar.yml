name: Build MTAR

on:
  push:
    branches: [main]
    paths: ['extensions/**', 'scripts/**', 'package-lock.json']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-mtar
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Detect extensions to build
        id: detect
        run: |
          all=$(ls -d extensions/*/ | xargs -n1 basename)
          before="${{ github.event.before }}"
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] || [ -z "$before" ] || [ "$before" = "0000000000000000000000000000000000000000" ] \
             || ! git cat-file -e "$before" 2>/dev/null \
             || git diff --name-only "$before" HEAD | grep -qE '^(scripts/|package-lock.json)'; then
            list="$all"
          else
            list=$(git diff --name-only "$before" HEAD | grep '^extensions/' | cut -d/ -f2 | sort -u)
          fi
          list=$(echo "$list" | xargs)
          echo "Extensions: $list"
          echo "list=$list" >> "$GITHUB_OUTPUT"

      - name: Bump patch versions
        if: steps.detect.outputs.list != ''
        run: node scripts/bump-version.mjs ${{ steps.detect.outputs.list }}

      - name: Install
        if: steps.detect.outputs.list != ''
        run: npm ci

      - name: Build MTAR
        if: steps.detect.outputs.list != ''
        run: node scripts/ext.mjs build:mtar ${{ steps.detect.outputs.list }}

      - name: Commit version bump
        if: steps.detect.outputs.list != ''
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add extensions/*/mta.yaml extensions/*/package.json
          git commit -m "chore: bump extension versions [skip ci]"
          # main may have moved while this job was building: rebase the bump commit onto it and retry
          for attempt in 1 2 3 4 5; do
            git pull --rebase origin main && git push && exit 0
            echo "Push attempt $attempt failed, retrying..."
            sleep $((attempt * 3))
          done
          echo "Could not push the version bump" >&2
          exit 1

      # One GitHub Release per extension version, with the .mtar attached as a plain file
      # (no zip to extract). Tag: <extension>-v<version>, e.g. delivery-to-invoice-v1.0.3
      - name: Publish .mtar releases
        if: steps.detect.outputs.list != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for ext in ${{ steps.detect.outputs.list }}; do
            version=$(sed -n 's/^version:[[:space:]]*"\{0,1\}\([^"[:space:]]*\)"\{0,1\}[[:space:]]*$/\1/p' "extensions/$ext/mta.yaml" | head -n1)
            file=$(ls extensions/$ext/mta_archives/*.mtar)
            tag="$ext-v$version"
            gh release delete "$tag" --yes --cleanup-tag 2>/dev/null || true
            gh release create "$tag" "$file" \
              --target "$(git rev-parse HEAD)" \
              --title "$ext $version" \
              --notes "SAP B1 Web Client extension archive for Extension Manager. Download the .mtar and upload it as-is."
          done
